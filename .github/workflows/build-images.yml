name: Build images and publish

on:
  push:
    branches:
      - "main"
    paths:
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
      - "turbo.json"

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  get-version:
    name: Get next version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.semantic.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for semantic-release to analyze history

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Get next version
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Needed to avoid rate-limiting
        run: |
          # Run semantic-release in dry-run mode and capture the output
          # The output will contain a line like "The next release version is 1.2.3"
          OUTPUT=$(npx semantic-release --dry-run)

          # Extract the version number using grep and sed
          VERSION=$(echo "$OUTPUT" | grep "The next release version is" | sed -n 's/.*is \([0-9.]*\).*/\1/p')

          if [[ -z "$VERSION" ]]; then
            echo "No new version to release. Exiting."
            # If you want to stop the workflow, you can exit 1 here
            # For now, we'll just set a default or last tag
            VERSION=$(git describe --tags --abbrev=0)
          fi

          echo "version=${VERSION}" >> $GITHUB_OUTPUT

  build:
    name: Build and push Docker images to registry
    runs-on: ubuntu-latest
    needs: get-version
    if: needs.get-version.outputs.version != ''
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      matrix:
        app: [server, browser]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate build metadata
        id: build_meta
        run: |
          VERSION="${{ needs.get-version.outputs.version }}"
          SHA=$(git rev-parse --short HEAD)
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "FULL_VERSION=${VERSION}-${SHA}" >> $GITHUB_OUTPUT
          echo "ENVIRONMENT=${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}" >> $GITHUB_OUTPUT
          echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Metadata action
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.app }}
          tags: |
            type=raw,value=${{ needs.get-version.outputs.version }}
            type=raw,value=latest,enable=${{ steps.build_meta.outputs.ENVIRONMENT == 'production' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/${{ matrix.app }}/Dockerfile
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.build_meta.outputs.VERSION }}
            ENVIRONMENT=${{ steps.build_meta.outputs.ENVIRONMENT }}
            BUILD_DATE=${{ steps.build_meta.outputs.BUILD_DATE }}
